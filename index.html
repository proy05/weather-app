<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>

    <form class="weatherForm" action="">
      <input type="text" class="cityInput" placeholder="Enter city">
      <button type="submit">Get Weather</button>
    </form>

    <div class="card">
        <h1 class="cityDisplay">New Delhi</h1>
        <p class="tempDisplay">38℃</p>
        <p class="humidityDisplay">Humidity: 75%</p>
        <p class="descDisplay">Clear Skies</p>
        <p class="weatherEmoji">🌞</p>
        <p class="errorDisplay">Please enter a city</p>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
